<svg width="423" height="740" viewBox="0 0 423 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="423" height="740" rx="33" fill="#F8F7F9"/>

  <text x="211.5" y="54" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">Guía de tallas</text>
  <text x="211.5" y="78" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#868686">Sudadera Ocean</text>

  <!-- Todo el diagrama (prenda + cotas A/B + leyenda) va en un solo grupo
       trasladado: la prenda por sí sola ya queda centrada en x=211.5,
       pero la cota B (una barra vertical solo del lado derecho, sin nada
       que la balancee del lado izquierdo) corre el centro visual de todo
       el conjunto hacia la derecha, reportado explícitamente ("que
       todo quede bien centrado"). -25 en x recentra el conjunto completo
       (prenda + ambas cotas) dentro de la tarjeta en vez de solo la
       prenda sola. -->
  <g transform="translate(-25 0)">
    <!-- Diagrama: sudadera con capucha, vista de frente -->
    <g fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- capucha -->
      <path d="M172 118c0-22 17.5-40 39.5-40s39.5 18 39.5 40" />
      <!-- cuerpo + mangas, un solo contorno -->
      <path d="M172 118l-38 22-24 34 26 20 12-10v96a10 10 0 0 0 10 10h107a10 10 0 0 0 10-10v-96l12 10 26-20-24-34-38-22" />
      <!-- bolsillo canguro -->
      <path d="M178 218a34 22 0 0 0 67 0" stroke="#C9C8CC" stroke-width="1.6" />
    </g>

    <!-- Cota A: Ancho (horizontal, a la altura del pecho). Encontrado al
         revisar de cerca: las puntas de esta línea (antes en x=122/301,
         más ancha que el propio torso) caían FUERA del panel recto de la
         prenda, justo sobre la muesca diagonal de la axila: la línea
         cruzaba encima del contorno de la prenda ahí, un cruce/encimado
         real confirmado con una captura recortada de esa zona. Ahora sus
         puntas (x=148/275) coinciden exactamente con los lados rectos
         del torso (donde el contorno ya es una simple línea vertical, sin
         ninguna diagonal ni muesca que cruzar), y a esta altura (y=200)
         tampoco toca el arco gris del bolsillo (empieza en y=218). El
         círculo sigue con su margen de 18px hacia arriba de siempre. -->
    <line x1="148" y1="196" x2="148" y2="204" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="275" y1="196" x2="275" y2="204" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="148" y1="200" x2="275" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="211.5" cy="167" r="11" fill="#1A1A1A"/>
    <text x="211.5" y="171.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">A</text>

    <!-- Cota B: Largo (vertical, del cuello al borde) -->
    <line x1="322" y1="98" x2="330" y2="98" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="322" y1="298" x2="330" y2="298" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="326" y1="98" x2="326" y2="298" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="352" cy="198" r="11" fill="#1A1A1A"/>
    <text x="352" y="202.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">B</text>

    <!-- Leyenda A/B: una sola fila, dos columnas justificadas igual -->
    <g>
      <circle cx="141.5" cy="346" r="13" fill="#1A1A1A"/>
      <text x="141.5" y="350.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A</text>
      <text x="163.5" y="346" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Ancho</text>
    </g>
    <g>
      <circle cx="281.5" cy="346" r="13" fill="#1A1A1A"/>
      <text x="281.5" y="350.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">B</text>
      <text x="303.5" y="346" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Largo</text>
    </g>
  </g>

  <!-- Tabla: 7 tallas reales -->
  <rect x="45" y="386" width="333" height="324" rx="16" fill="#FFFFFF" stroke="#E4E4E4"/>
  <text x="111.5" y="415" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">TALLA</text>
  <text x="242.5" y="415" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">ANCHO (A)</text>
  <text x="342.5" y="415" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">LARGO (B)</text>
  <line x1="61" y1="430" x2="362" y2="430" stroke="#E4E4E4"/>

  <!-- filas: XS, S, M, L, XL, XXL, 3XL -->
  <g font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">
    <text x="111.5" y="458">XS</text><text x="242.5" y="458">50 cm</text><text x="342.5" y="458">67 cm</text>
    <line x1="61" y1="472" x2="362" y2="472" stroke="#F0EFF1"/>

    <text x="111.5" y="496">S</text><text x="242.5" y="496">52 cm</text><text x="342.5" y="496">68 cm</text>
    <line x1="61" y1="510" x2="362" y2="510" stroke="#F0EFF1"/>

    <text x="111.5" y="534">M</text><text x="242.5" y="534">54 cm</text><text x="342.5" y="534">69 cm</text>
    <line x1="61" y1="548" x2="362" y2="548" stroke="#F0EFF1"/>

    <text x="111.5" y="572">L</text><text x="242.5" y="572">56 cm</text><text x="342.5" y="572">70 cm</text>
    <line x1="61" y1="586" x2="362" y2="586" stroke="#F0EFF1"/>

    <text x="111.5" y="610">XL</text><text x="242.5" y="610">58 cm</text><text x="342.5" y="610">71 cm</text>
    <line x1="61" y1="624" x2="362" y2="624" stroke="#F0EFF1"/>

    <text x="111.5" y="648">XXL</text><text x="242.5" y="648">60 cm</text><text x="342.5" y="648">72 cm</text>
    <line x1="61" y1="662" x2="362" y2="662" stroke="#F0EFF1"/>

    <text x="111.5" y="686">3XL</text><text x="242.5" y="686">62 cm</text><text x="342.5" y="686">74 cm</text>
  </g>
</svg>
