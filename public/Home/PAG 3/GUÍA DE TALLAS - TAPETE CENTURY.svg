<svg width="423" height="620" viewBox="0 0 423 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="423" height="620" rx="33" fill="#F8F7F9"/>

  <text x="211.5" y="54" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">Medidas</text>
  <text x="211.5" y="78" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#868686">Tapete Century</text>

  <!-- Diagrama: tapete extendido, visto desde arriba -->
  <rect x="90" y="140" width="280" height="94" rx="12" fill="#FFFFFF" stroke="#57E0D9" stroke-width="2"/>
  <line x1="104" y1="152" x2="104" y2="222" stroke="#E4E4E4" stroke-width="2"/>

  <!-- Cota superior: Largo (B) -->
  <line x1="90" y1="120" x2="90" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="370" y1="120" x2="370" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="90" y1="124" x2="370" y2="124" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="230" cy="98" r="11" fill="#1A1A1A"/>
  <text x="230" y="102.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">B</text>

  <!-- Cota izquierda: Ancho (A) -->
  <line x1="70" y1="140" x2="78" y2="140" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="70" y1="234" x2="78" y2="234" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="74" y1="140" x2="74" y2="234" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="40" cy="187" r="11" fill="#1A1A1A"/>
  <text x="40" y="191.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">A</text>

  <!-- Leyenda A/B: una sola fila, dos columnas justificadas igual -->
  <g>
    <circle cx="141.5" cy="266" r="13" fill="#1A1A1A"/>
    <text x="141.5" y="270.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A</text>
    <text x="163.5" y="266" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Ancho</text>
  </g>
  <g>
    <circle cx="281.5" cy="266" r="13" fill="#1A1A1A"/>
    <text x="281.5" y="270.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">B</text>
    <text x="303.5" y="266" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Largo</text>
  </g>

  <!-- Tabla: talla única del tapete -->
  <rect x="45" y="306" width="333" height="98" rx="16" fill="#FFFFFF" stroke="#E4E4E4"/>
  <text x="111.5" y="335" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">TALLA</text>
  <text x="211.5" y="335" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">ANCHO (A)</text>
  <text x="311.5" y="335" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">LARGO (B)</text>
  <line x1="61" y1="350" x2="362" y2="350" stroke="#E4E4E4"/>
  <text x="111.5" y="380" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Único</text>
  <text x="211.5" y="380" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">62 cm</text>
  <text x="311.5" y="380" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">184 cm</text>

  <!-- Medidas de la funda -->
  <text x="45" y="440" text-anchor="start" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Funda</text>
  <rect x="45" y="452" width="333" height="90" rx="16" fill="#FFFFFF" stroke="#E4E4E4"/>
  <text x="140" y="480" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">LARGO</text>
  <text x="283" y="480" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">DIÁMETRO</text>
  <line x1="61" y1="495" x2="362" y2="495" stroke="#E4E4E4"/>
  <text x="140" y="525" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">84 cm</text>
  <text x="283" y="525" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">14 cm</text>

  <text x="211.5" y="580" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#868686">Grosor del tapete: 0.8 cm · Superficie antideslizante</text>
</svg>
