<svg width="423" height="560" viewBox="0 0 423 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="423" height="560" rx="33" fill="#F8F7F9"/>

  <text x="211.5" y="54" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">Guía de tallas</text>
  <text x="211.5" y="78" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#868686">Tapete de Yoga Minsk</text>

  <!-- Diagrama: tapete extendido, visto desde arriba -->
  <rect x="90" y="140" width="280" height="94" rx="12" fill="#FFFFFF" stroke="#57E0D9" stroke-width="2"/>
  <line x1="104" y1="152" x2="104" y2="222" stroke="#E4E4E4" stroke-width="2"/>

  <!-- Cota superior: Largo (B) -->
  <line x1="90" y1="120" x2="90" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="370" y1="120" x2="370" y2="128" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="90" y1="124" x2="370" y2="124" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="230" cy="98" r="11" fill="#1A1A1A"/>
  <text x="230" y="102.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">B</text>

  <!-- Cota izquierda: Ancho (A) -->
  <line x1="70" y1="140" x2="78" y2="140" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="70" y1="234" x2="78" y2="234" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="74" y1="140" x2="74" y2="234" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="40" cy="187" r="11" fill="#1A1A1A"/>
  <text x="40" y="191.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">A</text>

  <!-- Leyenda A/B -->
  <g>
    <circle cx="112" cy="272" r="13" fill="#1A1A1A"/>
    <text x="112" y="276.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A</text>
    <text x="134" y="272" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Ancho</text>
  </g>
  <g>
    <circle cx="112" cy="316" r="13" fill="#1A1A1A"/>
    <text x="112" y="320.5" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">B</text>
    <text x="134" y="316" text-anchor="start" dominant-baseline="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Largo</text>
  </g>

  <!-- Tabla: talla única -->
  <rect x="45" y="366" width="333" height="98" rx="16" fill="#FFFFFF" stroke="#E4E4E4"/>
  <text x="111.5" y="395" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">TALLA</text>
  <text x="211.5" y="395" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">ANCHO (A)</text>
  <text x="311.5" y="395" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#868686">LARGO (B)</text>
  <line x1="61" y1="410" x2="362" y2="410" stroke="#E4E4E4"/>
  <text x="111.5" y="440" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Único</text>
  <text x="211.5" y="440" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">61 cm</text>
  <text x="311.5" y="440" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">183 cm</text>

  <text x="211.5" y="500" text-anchor="middle" font-family="DM Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#868686">Grosor: 0.6 cm · Superficie antideslizante</text>
</svg>
